<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101018">
  <title>إنشاء حساب | CASS TV</title>
  <link rel="stylesheet" href="/register.css">
</head>
<body>
  <main class="card">
    <a class="brand" href="/">CASS <b>TV</b></a>
    <span class="tag">XTREAM CODES</span>
    <h1>طلب إنشاء حساب</h1>
    <p class="intro">أنشئ طلبك وانتظر موافقة المدير. لن تعمل بيانات Xtream قبل الموافقة.</p>
    <form id="registerForm">
      <label for="username">اسم المستخدم</label>
      <input id="username" name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+" autocomplete="username" placeholder="مثال: cass_user">
      <label for="password">كلمة المرور</label>
      <input id="password" name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password" placeholder="8 أحرف على الأقل">
      <label for="confirmPassword">تأكيد كلمة المرور</label>
      <input id="confirmPassword" name="confirmPassword" type="password" required minlength="8" maxlength="128" autocomplete="new-password" placeholder="أعد كتابة كلمة المرور">
      <button type="submit">إرسال طلب التسجيل</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
    <a class="back" href="/">العودة إلى CASS TV</a>
  </main>
  <script src="/register.js"></script>
</body>
</html>
